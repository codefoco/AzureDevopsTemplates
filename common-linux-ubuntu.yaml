steps:
  - script: |
      sudo apt-get update && sudo apt-get install -y ca-certificates gnupg
      
      # 1. Download to a temporary keyring (which will be in keybox format)
      sudo gpg --homedir /tmp --no-default-keyring --keyring /tmp/mono-legacy.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
      
      # 2. Export it cleanly into a raw OpenPGP format that modern apt accepts
      sudo mkdir -p /usr/share/keyrings
      sudo gpg --no-default-keyring --keyring /tmp/mono-legacy.gpg --export --output /usr/share/keyrings/mono-official-archive-keyring.gpg
      
      # 3. Clean up the temp file
      sudo rm /tmp/mono-legacy.gpg

      # 4. Add the repository and update
      echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
      sudo apt-get update

    displayName: 'Setup mono apt' 

  - script: 'sudo apt-get install -y mono-devel msbuild ca-certificates-mono'
    displayName: 'sudo apt install mono-devel msbuild ca-certificates-mono'
      
  - script: 'sudo $(which cert-sync) /etc/ssl/certs/ca-certificates.crt'
    displayName: 'sudo $(which cert-sync) /etc/ssl/certs/ca-certificates.crt'

  # Patch Mono MSBuild assemblies on Ubuntu 26.04
  - script: |
    MSBUILD_BIN="/usr/lib/mono/msbuild/Current/bin"
    CURRENT_VER=$(monodis --assembly "$MSBUILD_BIN/System.Reflection.Metadata.dll" 2>/dev/null | awk '/Version:/ {print $2}')

    if [ "$CURRENT_VER" != "5.0.0.0" ]; then
      echo "Detected System.Reflection.Metadata version '$CURRENT_VER' (expected 5.0.0.0). Patching..."
      TMP_DIR="/tmp/srm-patch"
      mkdir -p "$TMP_DIR"
      curl -sL "https://nuget.org" -o "$TMP_DIR/srm.nupkg"
      unzip -q "$TMP_DIR/srm.nupkg" -d "$TMP_DIR/extracted"
      sudo cp -f "$TMP_DIR/extracted/lib/netstandard2.0/System.Reflection.Metadata.dll" "$MSBUILD_BIN/System.Reflection.Metadata.dll"
      sudo gacutil -i "$MSBUILD_BIN/System.Reflection.Metadata.dll"
      rm -rf "$TMP_DIR"
    else
      echo "System.Reflection.Metadata is already 5.0.0.0. Skipping patch."
    fi
  displayName: 'Ensure System.Reflection.Metadata 5.0.0.0 for Mono MSBuild'

